<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#161817" media="(prefers-color-scheme: dark)">
    <title>MDShelf</title>
    <link rel="stylesheet" href="./vendor/katex/katex.min.css?v=0.18.4">
    <link rel="stylesheet" href="./app.css?v=8">
    <link rel="stylesheet" href="./chroma.css?v=2">
    <script defer src="./vendor/katex/katex.min.js?v=0.18.4"></script>
    <script defer src="./vendor/mermaid.min.js?v=11.17.2"></script>
    <script defer src="./app.js?v=10"></script>
  </head>
  <body>
    <a class="skip-link" href="#reader">Skip to document</a>

    <header class="topbar">
      <button
        class="icon-button menu-button"
        id="menu-button"
        type="button"
        aria-label="Open document list"
        aria-controls="drawer"
        aria-expanded="false"
      >
        <span class="menu-icon" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <a class="brand" id="brand" href="#" aria-label="MDShelf home">MDShelf</a>
      <p class="current-file" id="current-file">Documents</p>
      <div class="settings">
        <button
          class="icon-button settings-button"
          id="settings-button"
          type="button"
          aria-label="Open settings"
          aria-controls="settings-popup"
          aria-expanded="false"
          aria-haspopup="dialog"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.08 14H3v-4h.08A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63a1.7 1.7 0 0 0 1-1.55V3h4v.08A1.7 1.7 0 0 0 15 4.63a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9a1.7 1.7 0 0 0 1.55 1H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"></path>
          </svg>
        </button>
        <section class="settings-popup" id="settings-popup" role="dialog" aria-labelledby="settings-title" hidden>
          <h2 id="settings-title">Appearance</h2>
          <label for="color-theme">
            <span>Color theme</span>
            <select id="color-theme">
              <option value="system">System</option>
              <option value="light">MDShelf Light</option>
              <option value="dark">MDShelf Dark</option>
              <option value="catppuccin-latte">Catppuccin Latte</option>
              <option value="catppuccin-mocha">Catppuccin Mocha</option>
              <option value="dracula">Dracula</option>
              <option value="nord">Nord</option>
              <option value="solarized-light">Solarized Light</option>
              <option value="solarized-dark">Solarized Dark</option>
            </select>
          </label>
          <label for="syntax-theme">
            <span>Syntax theme</span>
            <select id="syntax-theme">
              <option value="github-auto">GitHub (match color theme)</option>
              <option value="catppuccin-auto">Catppuccin (match color theme)</option>
              <option value="solarized-auto">Solarized (match color theme)</option>
              <option value="dracula">Dracula</option>
              <option value="monokai">Monokai</option>
              <option value="nord">Nord</option>
              <option value="tokyonight-night">Tokyo Night</option>
            </select>
          </label>
        </section>
      </div>
    </header>

    <button class="backdrop" id="backdrop" type="button" tabindex="-1" aria-label="Close document list"></button>

    <aside class="drawer" id="drawer" aria-label="Document list">
      <div class="drawer-heading">
        <div>
          <p class="eyebrow">Local library</p>
          <p class="drawer-title">MDShelf</p>
        </div>
        <button class="icon-button close-button" id="close-button" type="button" aria-label="Close document list">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <label class="search" for="file-filter">
        <span class="search-icon" aria-hidden="true"></span>
        <span class="sr-only">Filter documents</span>
        <input id="file-filter" type="search" placeholder="Filter documents" autocomplete="off" spellcheck="false">
      </label>

      <nav class="file-nav" id="file-nav" aria-label="Markdown files">
        <div class="nav-loading" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </nav>
      <div class="drawer-footer">
        <a class="demo-link" id="demo-link" href="#/__mdshelf_demo__">Demo</a>
        <p class="file-count" id="file-count" aria-live="polite">Loading documents</p>
      </div>
    </aside>

    <main class="reader" id="reader" tabindex="-1">
      <div class="reader-inner">
        <section class="status-view" id="status-view" aria-live="polite" aria-busy="true">
          <div class="document-skeleton" aria-hidden="true">
            <span class="skeleton-title"></span>
            <span></span><span></span><span class="short"></span>
            <span></span><span class="medium"></span>
          </div>
          <div class="status-message" id="status-message" hidden></div>
        </section>
        <p class="document-path" id="document-path" hidden></p>
        <article class="markdown" id="document" hidden></article>
      </div>
    </main>

    <p class="update-notice" id="update-notice" role="status" aria-live="polite" aria-atomic="true"></p>
    <p class="sr-only" id="route-status" aria-live="polite" aria-atomic="true"></p>
    <noscript>
      <p class="noscript">MDShelf needs JavaScript to load documents.</p>
    </noscript>
  </body>
</html>
