name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly run so govulncheck scans the latest vulnerability data
    # even when the repository is idle.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            printf 'Run gofmt on:\n%s\n' "$files"
            exit 1
          fi

      - name: Vet Go code
        run: go vet ./...

      - name: Check JavaScript
        run: |
          node --check web/text-selection.js
          node --check web/app.js
          node --test web/app.test.cjs web/text-selection.test.cjs

      - name: Scan for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Build production binary
        run: go build -trimpath -ldflags="-s -w" -o /tmp/mdshelf .

  lint:
    name: Lint Go code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # golangci-lint v2.8.0 is built with Go 1.25; its type checker panics
      # on a newer Go standard library, so this job pins the matching Go
      # minor. Bump the Go version and the linter version together.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.8.0

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum

      # The 8 minute test timeout stays below timeout-minutes so a hung
      # test ends with a goroutine dump that names it, not a silent job
      # cancellation.
      - name: Run tests with race detector
        run: go test -race -count=1 -timeout 8m ./...
