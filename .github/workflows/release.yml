name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH form"
            exit 1
          fi

          tag_commit="$(git rev-parse --verify "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit on main"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum

      - name: Verify source
        shell: bash
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            printf 'Run gofmt on:\n%s\n' "$files"
            exit 1
          fi

          go vet ./...
          go test -race -count=1 ./...
          node --check web/app.js
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  build:
    name: Package ${{ matrix.group }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: darwin
            runner: macos-15
            cgo: "1"
            targets: "darwin/amd64 darwin/arm64"
          - group: portable
            runner: ubuntu-latest
            cgo: "0"
            targets: "linux/amd64 linux/arm64 windows/amd64 windows/arm64"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache-dependency-path: go.sum

      - name: Test native watcher
        if: matrix.group == 'darwin'
        shell: bash
        run: go test -race -count=1 ./...

      - name: Build release archives
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          mkdir -p build dist

          for target in $TARGETS; do
            target_os="${target%/*}"
            target_arch="${target#*/}"
            base="mdshelf_${version}_${target_os}_${target_arch}"
            stage="build/$base"
            binary="$stage/mdshelf"

            mkdir -p "$stage"
            if [[ "$target_os" == "windows" ]]; then
              binary+=".exe"
            fi

            GOOS="$target_os" GOARCH="$target_arch" \
              go build -trimpath -ldflags="-s -w" -o "$binary" .

            cp LICENSE README.md THIRD_PARTY_NOTICES "$stage/"

            if [[ "$target_os" == "windows" ]]; then
              (
                cd "$stage"
                zip -q -r "../../dist/$base.zip" .
              )
            else
              tar -C "$stage" -czf "dist/$base.tar.gz" .
            fi
          done

      - name: Store release archives
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.group }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "MDShelf $GITHUB_REF_NAME" \
            dist/*
